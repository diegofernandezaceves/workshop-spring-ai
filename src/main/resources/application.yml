logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    org.springframework.ai.transformer: WARN
    root: info

spring:
  application:
    name: financial-assistant-ai
  profiles:
    active: @ai.profile@
  mongodb:
    uri: mongodb://localhost/financial-assistant
  ai:
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        initialize-schema: true
    banking:
      collection-name: banking-transactions
    financial:
      collection-name: financial-knowledge
